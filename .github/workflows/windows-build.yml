name: Build Windows MSI

# Runs only on demand or when you push a version tag — never on every push,
# so it doesn't silently consume Actions minutes.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-msi:
    runs-on: windows-latest  # WiX Toolset v3 is preinstalled on this runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # packageMsi (not packageReleaseMsi): no ProGuard/minification, so Koin DI
      # and kotlinx.serialization reflection keep working. Bundles a full JRE.
      - name: Build MSI installer
        run: .\gradlew.bat :desktopApp:packageMsi --no-daemon --stacktrace

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
