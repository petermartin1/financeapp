name: Release binaries

# Builds installers for the desktop platforms and attaches them to a GitHub
# Release. Runs when you push a version tag (e.g. `v1.2.0`), or on demand via the
# Actions tab. Never runs on ordinary pushes, so it doesn't burn Actions minutes.
#
# A manual run can target one platform (or all). A tag push always builds all
# four and publishes a Release.
#
# The artifacts are UNSIGNED (no paid Apple/Windows certificates). First-launch
# notes for users live in the release body and the README:
#   - macOS:   right-click the app → Open the first time (Gatekeeper).
#   - Windows: "More info" → "Run anyway" (SmartScreen).
# Dropping in signing certs later is a config-only change.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the installers (no leading v), major >= 1, e.g. 1.2.0"
        required: false
        default: "1.0.0"
      platform:
        description: "Which platform(s) to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos-arm
          - macos-intel
  push:
    tags:
      - "v*"

# Cancel an in-progress run for the same ref if a new one starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # needed to create the Release and upload assets

jobs:
  # Resolve the version and the (possibly filtered) build matrix once, cheaply,
  # before any heavy runner is allocated. A bad version fails here instantly.
  setup:
    name: Resolve version & matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            v="${REF_NAME#v}"
          else
            v="${INPUT_VERSION:-1.0.0}"
          fi
          # Keep only an installer-safe numeric version (jpackage rejects junk).
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Invalid version '$v' (expected N or N.N or N.N.N)"
            exit 1
          fi
          # jpackage maps the version to macOS CFBundleVersion, whose first
          # component Apple requires to be >= 1 — so 0.x can never build a .dmg.
          if [ "${v%%.*}" -lt 1 ]; then
            echo "::error::Version '$v' has major 0; macOS (jpackage/CFBundleVersion) requires major >= 1. Start at 1.0.0."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Select platforms
        id: select
        shell: bash
        env:
          # Empty on tag pushes -> treated as "all" below.
          PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          all='[
            {"id":"linux","name":"Linux (.deb)","os":"ubuntu-latest","task":"packageDeb","glob":"desktopApp/build/compose/binaries/main/deb/*.deb","suffix":"linux-amd64"},
            {"id":"windows","name":"Windows (.msi)","os":"windows-latest","task":"packageMsi","glob":"desktopApp/build/compose/binaries/main/msi/*.msi","suffix":"windows-x64"},
            {"id":"macos-arm","name":"macOS Apple Silicon (.dmg)","os":"macos-14","task":"packageDmg","glob":"desktopApp/build/compose/binaries/main/dmg/*.dmg","suffix":"macos-arm64"},
            {"id":"macos-intel","name":"macOS Intel (.dmg)","os":"macos-13","task":"packageDmg","glob":"desktopApp/build/compose/binaries/main/dmg/*.dmg","suffix":"macos-x64"}
          ]'
          p="${PLATFORM:-all}"
          if [ "$p" = "all" ]; then
            m=$(printf '%s' "$all" | jq -c '{include: .}')
          else
            m=$(printf '%s' "$all" | jq -c --arg p "$p" '{include: [.[] | select(.id == $p)]}')
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "Selected matrix: $m"

  build:
    name: Build ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # package* (not packageRelease*): no ProGuard/minification, so Koin DI and
      # kotlinx.serialization reflection keep working. Bundles a trimmed JRE.
      - name: Build installer
        shell: bash
        env:
          APP_VERSION: ${{ needs.setup.outputs.version }}
        run: ./gradlew :desktopApp:${{ matrix.task }} -PappVersion="$APP_VERSION" --no-daemon --stacktrace

      # Give each file a platform-tagged name so the installers never collide as
      # release assets (jpackage names the two .dmg files identically otherwise).
      - name: Stage artifact
        shell: bash
        env:
          APP_VERSION: ${{ needs.setup.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist
          for f in ${{ matrix.glob }}; do
            ext="${f##*.}"
            cp "$f" "dist/FinanceApp-${APP_VERSION}-${SUFFIX}.${ext}"
          done
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a Release for an actual tag push; manual runs just leave the
    # build artifacts attached to the workflow run for download.
    if: github.ref_type == 'tag'
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Unsigned desktop installers for ${{ github.ref_name }}.

            **First launch (one time, because the builds are unsigned):**
            - **macOS** — right-click the app and choose **Open**, then confirm. (Gatekeeper blocks a plain double-click on unsigned apps.)
            - **Windows** — on the SmartScreen prompt click **More info → Run anyway**.
            - **Linux** — `sudo dpkg -i FinanceApp-*-linux-amd64.deb`

            Prefer to run from source? `./gradlew :desktopApp:run`
