name: Release binaries

# Builds installers for every desktop platform and attaches them to a GitHub
# Release. Runs when you push a version tag (e.g. `v1.2.0`), or on demand via the
# Actions tab. Never runs on ordinary pushes, so it doesn't burn Actions minutes.
#
# The artifacts are UNSIGNED (no paid Apple/Windows certificates). First-launch
# notes for users live in the release body and the README:
#   - macOS:   right-click the app → Open the first time (Gatekeeper).
#   - Windows: "More info" → "Run anyway" (SmartScreen).
# Dropping in signing certs later is a config-only change (see commented hooks
# in desktopApp/build.gradle.kts / the macOS notarization block).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the installers (no leading v), major >= 1, e.g. 1.2.0"
        required: false
        default: "1.0.0"
      platform:
        description: "Which platform(s) to build"
        required: false
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos-arm
          - macos-intel
  push:
    tags:
      - "v*"

# Cancel an in-progress run for the same tag if a new one starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # needed to create the Release and upload assets

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # On a tag push, build everything. On a manual run, build only the chosen
    # platform (or all). Jobs that don't match are skipped before a runner is
    # even allocated, so a single-OS run doesn't tie up the others.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == matrix.id
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            name: Linux (.deb)
            os: ubuntu-latest
            task: packageDeb
            glob: desktopApp/build/compose/binaries/main/deb/*.deb
            suffix: linux-amd64
          - id: windows
            name: Windows (.msi)
            os: windows-latest
            task: packageMsi
            glob: desktopApp/build/compose/binaries/main/msi/*.msi
            suffix: windows-x64
          - id: macos-arm
            name: macOS Apple Silicon (.dmg)
            os: macos-14
            task: packageDmg
            glob: desktopApp/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-arm64
          - id: macos-intel
            name: macOS Intel (.dmg)
            os: macos-13
            task: packageDmg
            glob: desktopApp/build/compose/binaries/main/dmg/*.dmg
            suffix: macos-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tag push -> strip the leading "v"; manual run -> use the input.
      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            v="${REF_NAME#v}"
          else
            v="$INPUT_VERSION"
          fi
          # Keep only an installer-safe numeric version (jpackage rejects junk).
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Invalid version '$v' (expected N or N.N or N.N.N)"
            exit 1
          fi
          # jpackage maps the version to macOS CFBundleVersion, whose first
          # component Apple requires to be >= 1 — so 0.x can never build a .dmg.
          if [ "${v%%.*}" -lt 1 ]; then
            echo "::error::Version '$v' has major 0; macOS (jpackage/CFBundleVersion) requires major >= 1. Start at 1.0.0."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      # package* (not packageRelease*): no ProGuard/minification, so Koin DI and
      # kotlinx.serialization reflection keep working. Bundles a trimmed JRE.
      - name: Build installer
        shell: bash
        run: ./gradlew :desktopApp:${{ matrix.task }} -PappVersion=${{ steps.ver.outputs.version }} --no-daemon --stacktrace

      # Give each file a platform-tagged name so the four installers never collide
      # as release assets (jpackage names the two .dmg files identically otherwise).
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          for f in ${{ matrix.glob }}; do
            ext="${f##*.}"
            cp "$f" "dist/FinanceApp-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}.${ext}"
          done
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish a Release for an actual tag push; manual runs just leave the
    # build artifacts attached to the workflow run for download.
    if: github.ref_type == 'tag'
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Unsigned desktop installers for ${{ github.ref_name }}.

            **First launch (one time, because the builds are unsigned):**
            - **macOS** — right-click the app and choose **Open**, then confirm. (Gatekeeper blocks a plain double-click on unsigned apps.)
            - **Windows** — on the SmartScreen prompt click **More info → Run anyway**.
            - **Linux** — `sudo dpkg -i FinanceApp-*-linux-amd64.deb`

            Prefer to run from source? `./gradlew :desktopApp:run`
